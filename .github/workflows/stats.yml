name: Refresh GitHub stats

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render stat cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_github_stats.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update GitHub stats cards
          file_pattern: assets/*.svg
